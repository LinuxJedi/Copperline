name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Only main saves Rust caches. PRs can restore main's caches, while caches
# saved on a PR merge ref cannot serve other PRs and evict reusable entries
# when several of these large build matrices run concurrently.
jobs:
  build:
    # Keep the existing check name for branch-protection rules. The ci
    # profile inherits release semantics without shipping-only fat LTO.
    name: Build (release)
    # Copperline is developed on macOS, so the main fan-out runs there. The
    # other platforms have their own functional coverage: the linux-tests
    # job below runs the unit suites and probe goldens on Linux, and the
    # Windows workflow (.github/workflows/windows.yml) does the same on
    # Windows alongside its packaged-zip smoke test.
    #
    # This job compiles everything once and hands the finished binaries to
    # the test jobs below (needs: build) as a workflow artifact. Binaries,
    # not a shared cargo cache: the test executables are plain libtest
    # binaries and run fine without cargo.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The macOS packaging workflow also has a job called build, but
          # its explicit --target artifacts cannot warm this native build.
          key: ci-macos
      - name: Compile test binaries
        # cargo test also builds the ordinary binaries for integration tests,
        # so a separate cargo build would duplicate work. Keep all asset-gated
        # tests compiling (#[ignore] only affects execution). The JSON output
        # maps each test target to its hash-suffixed executable so the binaries
        # can be staged under stable names for the fan-out jobs.
        run: |
          cargo test --profile ci --locked --no-run --timings --message-format=json > cargo-test-build.json
          mkdir -p ci-bins
          cp target/ci/copperline ci-bins/
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
                   | [.target.kind[0], .target.name, .executable] | @tsv' cargo-test-build.json \
            | while IFS=$'\t' read -r kind name exe; do
                case "$kind:$name" in
                  lib:copperline)        cp "$exe" ci-bins/unit-lib ;;
                  bin:copperline)        cp "$exe" ci-bins/unit-bin-copperline ;;
                  bin:copperline-ctl)    cp "$exe" ci-bins/unit-bin-copperline-ctl ;;
                  test:probe_golden)     cp "$exe" ci-bins/probe_golden ;;
                  test:image_regression) cp "$exe" ci-bins/image_regression ;;
                esac
              done
          ls -l ci-bins
      - name: Upload binaries for the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: ci-bins
          path: ci-bins/
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Rustfmt and clippy
    # Style and lints need no release build, so this runs alongside the
    # build job instead of gating it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        # Hold the binary, tests, examples, and diagnostic feature gates to
        # the same warning-clean standard used for release checks.
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  fuzz-build:
    name: Fuzz harnesses build
    # Build every untrusted-input harness on each change so parser API
    # refactors cannot silently leave the fuzz workspace stale. Sustained
    # campaigns remain a local or scheduled workload.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@nightly
      - name: Generate the fuzz lockfile
        working-directory: fuzz
        run: |
          # This test-only workspace follows the root crate by path. Derive its
          # lockfile from the current manifests so a root Dependabot update
          # cannot leave a second committed dependency graph stale.
          cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build all fuzz targets
        working-directory: fuzz
        run: cargo fuzz build

  msrv:
    name: MSRV (rust-version)
    # Prove that Cargo.toml's declared minimum remains truthful when source
    # or dependency updates land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Install the declared Rust version
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "copperline") | .rust_version')"
          test -n "$msrv" && test "$msrv" != "null"
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      - name: Build with MSRV
        run: cargo +"$MSRV" build --locked
      - name: Compile unit tests with MSRV
        # The ordinary Linux job executes these tests. This gate owns source
        # compatibility, so compile the test targets without duplicating
        # host-network runtime tests whose timing is unrelated to the MSRV.
        run: cargo +"$MSRV" test --locked --lib --no-run

  cargo-deny:
    name: Dependency policy (${{ matrix.name }})
    # Frontends have standalone workspaces and lockfiles, so check each
    # shipped dependency graph explicitly.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            manifest: Cargo.toml
          - name: browser
            manifest: crates/copperline-web/Cargo.toml
          - name: player
            manifest: crates/copperline-player/Cargo.toml
          - name: libretro
            manifest: crates/copperline-libretro/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features --locked --config deny.toml
          command-arguments: --hide-inclusion-graph
          # Duplicate-version and git-wildcard findings are deliberate
          # warnings; hide only their verbose dependency inclusion graphs.

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-bins
          path: ci-bins
      - name: Unit tests
        # The inline #[cfg(test)] suites in the lib and binaries, prebuilt
        # by the build job (this is everything a root `cargo test` runs
        # besides tests/probe_golden.rs, which has its own job below; the
        # crate has no doctests). Artifact zips do not preserve the
        # executable bit, hence the chmod.
        run: |
          chmod +x ci-bins/*
          ./ci-bins/unit-lib
          ./ci-bins/unit-bin-copperline
          ./ci-bins/unit-bin-copperline-ctl

  probe-golden:
    name: Probe golden renders
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-bins
          path: ci-bins
      - name: Probe golden renders
        # tests/probe_golden.rs is fully self-contained (committed probe
        # binaries booted on the bundled AROS ROM) and compares each probe's
        # deterministic render pixel-for-pixel against the references in
        # timing-test/golden/ -- the hardware-behaviour regression net
        # (DDF/DIW placement and DDFSTRT-phase/scroll maps, raced
        # copper-chunky COLOR00 trains, sprite serializer/DMA-FSM positions,
        # BLTPRI CPU pacing bars, byte-write register mirroring, the CLXDAT
        # collision matrix, and the 32 CPU/chip-bus timing rows). Each probe
        # is its own #[test], so the boots run in parallel on the runner's
        # cores. See timing-test/README.md "CI golden renders" for the
        # re-bless workflow.
        #
        # The test harness spawns the emulator through the compile-time
        # CARGO_BIN_EXE_copperline path, which on hosted runners is the
        # same absolute path in every job of this repo -- hence the copy
        # into target/ci before running.
        run: |
          chmod +x ci-bins/*
          mkdir -p target/ci
          cp ci-bins/copperline target/ci/copperline
          ./ci-bins/probe_golden
      - name: Upload probe render diffs
        # On a golden mismatch the test writes the actual renders and diff
        # masks; surface them so the regression is reviewable from the run.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: probe-golden-diffs
          path: target/probe-golden/
          if-no-files-found: ignore

  hostsocket-plugin:
    name: HostSocket plugin (wasm32)
    # The bundled bsdsocket.library board (crates/hostsocket-plugin) ships
    # as a committed artifact (assets/hostsocket/hostsocket_plugin.wasm, the
    # blob a plain cargo build embeds), so nothing else in CI compiles this
    # crate at all. This job keeps the source buildable for its real target
    # and runs its native unit suite. It deliberately does not byte-compare
    # the artifact against a fresh build: rustc upgrades change wasm output,
    # and the artifact is only expected to be refreshed when the crate
    # itself changes (like the guest ROMs under assets/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/hostsocket-plugin
      - name: Build (wasm32-unknown-unknown)
        working-directory: crates/hostsocket-plugin
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Native unit tests
        working-directory: crates/hostsocket-plugin
        run: cargo test --locked

  zz9k-plugin:
    name: ZZ9K plugin (wasm32)
    # The bundled ZZ9000 crypto board (crates/zz9k-plugin) ships as a
    # committed artifact (assets/zz9k/zz9k_plugin.wasm, the blob a plain
    # cargo build embeds), built by that crate's Makefile from its own
    # standalone workspace. This job mirrors the hostsocket-plugin one
    # above: keep the source buildable for its real target, hold it to the
    # same fmt/clippy standard as the root workspace, and run its native
    # unit suite. Like hostsocket, it deliberately does not byte-compare
    # the artifact against a fresh build: rustc upgrades change wasm
    # output, and the artifact is only expected to be refreshed when the
    # crate itself changes (like the guest ROMs under assets/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/zz9k-plugin
      - name: Formatting
        working-directory: crates/zz9k-plugin
        run: cargo fmt --check
      - name: Clippy
        working-directory: crates/zz9k-plugin
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build (wasm32-unknown-unknown)
        working-directory: crates/zz9k-plugin
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Native unit tests
        working-directory: crates/zz9k-plugin
        run: cargo test --locked

  diagrom-smoke:
    name: DiagROM boot smoke
    needs: build
    runs-on: macos-latest
    # DiagROM (diagrom.com) is freely downloadable but its author keeps
    # redistribution to the official site, so it is fetched at run time
    # (checksum-pinned, cached across runs) instead of being committed.
    # The DIAGROM_URL repository variable optionally overrides the
    # download location should the official URL move; the stable V1.3
    # archive has been frozen upstream since 2023, so a checksum change
    # means the pin below needs updating, not that the job is flaky.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-bins
          path: ci-bins
      - name: Install prebuilt binaries
        # The image-regression harness spawns the emulator through the
        # compile-time CARGO_BIN_EXE_copperline path, which on hosted
        # runners is the same absolute path in every job of this repo --
        # hence the copy into target/ci.
        run: |
          chmod +x ci-bins/*
          mkdir -p target/ci
          cp ci-bins/copperline target/ci/copperline
      - name: Restore cached DiagROM
        id: diagrom-cache
        uses: actions/cache@v6
        with:
          path: diagrom.rom
          key: diagrom-stable-v1.3
      - name: Fetch DiagROM (stable V1.3)
        if: steps.diagrom-cache.outputs.cache-hit != 'true'
        env:
          DIAGROM_URL: ${{ vars.DIAGROM_URL }}
        run: |
          curl -fsSL --retry 3 "${DIAGROM_URL:-https://www.diagrom.com/files/stable/DiagROM.zip}" -o DiagROM.zip
          echo "a575f8fa69b1ac7fd566fcdcd19a68e53d472ac6c56d8a6a9489229882c5b208  DiagROM.zip" | shasum -a 256 -c
          unzip -o DiagROM.zip DiagROM/DiagROM
          mv DiagROM/DiagROM diagrom.rom
          rm -rf DiagROM.zip DiagROM
      - name: Verify DiagROM checksum
        # Runs on the cache-hit path too, so a corrupted or tampered cache
        # entry cannot slip through (the step above only checks the freshly
        # downloaded archive). This pin is the extracted ROM inside the
        # checksum-pinned stable V1.3 zip.
        run: |
          echo "1803bfff5d866de7605dbcf8445b590f36ed7cb7ee92166b240907e488cf0ff7  diagrom.rom" | shasum -a 256 -c
      - name: Boot smoke (serial banner + headless screenshot)
        # DiagROM boots as a Kickstart replacement, so the ROM is passed
        # positionally (the no-argument default is the bundled AROS ROM).
        # DiagROM mirrors its diagnostics to the serial port, which the
        # emulator routes to stdout by default; seeing the version banner
        # proves the ROM's boot code actually executed, which a non-empty
        # PNG alone does not (a black screen still writes one).
        run: |
          ./target/ci/copperline diagrom.rom --noaudio --screenshot-after 6 diag.png > serial.log
          grep -q "Amiga DiagROM" serial.log
          test -s diag.png
      - name: DiagROM menu image regression
        # The asset-gated integration test boots to the main menu and
        # asserts the status bar's left-margin text columns survive.
        run: |
          mkdir -p test-assets
          cp diagrom.rom test-assets/
          ./ci-bins/image_regression diagrom --ignored --nocapture
      - name: Upload boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagrom-boot
          path: |
            diag.png
            serial.log
          if-no-files-found: ignore

  linux-tests:
    # Preserve the required check name; the ci profile is release-derived.
    name: Linux tests (release)
    # Functional coverage on Linux: the inline unit suites and
    # tests/probe_golden.rs, whose pixel-exact golden comparisons prove the
    # deterministic core renders identically on Linux. Runs the whole thing
    # through cargo on an ubuntu runner rather than joining the macOS
    # binary fan-out above (the prebuilt binaries are mach-o). No display
    # or GPU stack is needed: capture runs use the windowless path, so only
    # the ALSA/udev build dependencies are installed. The asset-gated
    # integration tests skip themselves (#[ignore]).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ci-linux
      - name: Install build dependencies
        # ALSA (cpal) + udev (gilrs) headers, plus iproute2 for the A2065
        # veth probe below. Winit needs no X headers at build time (it dlopens
        # the client libraries at runtime, and no test opens a window).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 libasound2-dev libudev-dev
      - name: Unit tests and probe golden renders
        # Keep Cargo's artifact paths for the extra ignored tests below.
        # Selecting another target with a second Cargo invocation can rerun
        # build.rs and recompile the core even though its tests already exist.
        # Explicit bash enables pipefail so tee cannot hide a test failure.
        shell: bash
        run: cargo test --profile ci --locked --timings --message-format=json | tee cargo-test-results.log
      - name: Audio stems determinism
        # tests/audio_stems_determinism.rs needs no external assets (the
        # bundled AROS ROM booting with an empty DF0 is enough), but like
        # every emulator-driving test it is #[ignore]d so ordinary cargo
        # test runs stay fast; it is invoked explicitly here instead.
        run: |
          audio_test="$(
            jq -Rr 'fromjson? | select(.reason == "compiler-artifact"
              and .target.name == "audio_stems_determinism"
              and .target.kind[0] == "test" and .profile.test == true
              and .executable != null) | .executable' cargo-test-results.log
          )"
          test -x "$audio_test"
          "$audio_test" --ignored
      - name: A2065 bridge round trip over a veth pair
        # The ordinary suite covers the platform-independent bridge worker
        # with an in-memory Ethernet adapter. This privileged Linux-only
        # probe adds the real AF_PACKET socket and kernel BPF filter: the
        # emulated A2065 sends an ARP request through cl-a2065, and the kernel
        # on cl-peer answers as 192.0.2.1. Run only the one ignored lib test
        # as root; the normal suite above remains entirely unprivileged.
        run: |
          sudo ip link add cl-a2065 type veth peer name cl-peer
          trap 'sudo ip link delete cl-a2065 2>/dev/null || true' EXIT
          sudo sysctl -q -w net.ipv6.conf.cl-a2065.disable_ipv6=1
          sudo sysctl -q -w net.ipv6.conf.cl-peer.disable_ipv6=1
          sudo ip addr add 192.0.2.1/24 dev cl-peer
          sudo ip link set cl-a2065 up
          sudo ip link set cl-peer up
          libtest="$(
            jq -Rr 'fromjson? | select(.reason == "compiler-artifact" and .target.name == "copperline"
                and .target.kind[0] == "lib" and .profile.test == true
                and .executable != null) | .executable' cargo-test-results.log
          )"
          test -x "$libtest"
          sudo "$libtest" a2065_bridge_veth_round_trip_reaches_the_rx_ring \
            --ignored --nocapture
      - name: Upload probe render diffs
        # On a golden mismatch the test writes the actual renders and diff
        # masks; surface them so the regression is reviewable from the run.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: probe-golden-diffs-linux
          path: target/probe-golden/
          if-no-files-found: ignore
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-linux
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  wasm:
    name: Headless core and browser build
    # Guards the portability split behind the browser build (see
    # docs/guide/browser.md): the core must keep compiling without the
    # desktop frontend, and the web crate must keep compiling for
    # wasm32-unknown-unknown, including paired rollback on a release bundle.
    # No GPU or audio stack is reached without the `frontend` feature.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/copperline-web -> target
      - name: Core without the desktop frontend
        run: cargo check --no-default-features --locked
      - name: Save-state fixture across optional features
        run: |
          cargo test --locked --no-default-features --lib zorro_device::state::tests
          cargo test --locked --no-default-features --features mhi --lib zorro_device::state::tests
      - name: Shared ROM build helpers
        run: python3 -m unittest discover -s tools/tests -v
      - name: Headless benchmark binary
        run: cargo check --no-default-features --features bench-bin --locked
      - name: Web crate (wasm32-unknown-unknown)
        working-directory: crates/copperline-web
        run: cargo check --target wasm32-unknown-unknown --locked
      - name: Web wrapper unit tests
        working-directory: crates/copperline-web
        run: cargo test --locked
      - name: Web crate formatting
        # The web crate is a standalone workspace, so the root Formatting
        # step never reaches it.
        working-directory: crates/copperline-web
        run: cargo fmt --check
      - name: Browser rollback netplay on the release WASM bundle
        working-directory: crates/copperline-web
        run: |
          version="$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
          RUSTFLAGS="-C target-feature=+simd128" cargo build --release --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/copperline_web.wasm
          node ../../tools/check-web-netplay.mjs pkg
          node ../../tools/check-web-netplay-swaps.mjs pkg
      - name: Browser page controller tests
        working-directory: crates/copperline-web/www
        run: npm test

  netplay-service:
    name: Browser netplay room service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/netplay/package-lock.json
      - run: npm ci
        working-directory: services/netplay
      - run: npm test
        working-directory: services/netplay
      - run: npx wrangler deploy --env="" --dry-run
        working-directory: services/netplay

  player:
    name: Publisher-kit player crate
    # Guards the feature combination the player builds against (frontend +
    # cpu-jit; no control, gdb, or game-library) and the game-manifest
    # baking in crates/copperline-player. Check-only: the full bundle build
    # belongs to a publisher's own CI (docs/guide/publishing.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Frontend without the debug and library features
        run: cargo check --no-default-features --features frontend,cpu-jit --locked
      - name: Player crate (example manifest)
        working-directory: crates/copperline-player
        run: cargo check --locked
      - name: Player crate formatting
        # A standalone workspace, so the root Formatting step never
        # reaches it.
        working-directory: crates/copperline-player
        run: cargo fmt --check

  docs:
    name: Docs build (HTML + PDF)
    # Independent of the Rust build: catches MyST/cross-reference breakage
    # (e.g. duplicate labels that only collide in the single-document PDF).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install MyST CLI
        run: npm install -g mystmd
      - name: Install Typst (PDF renderer)
        # MyST shells out to Typst for PDF export; brew matches docs/README.md.
        run: brew install typst
      - name: Build HTML
        working-directory: docs
        run: myst build --html --ci --strict --check-links
      - name: Build PDF
        working-directory: docs
        # The PDF export merges every chapter into one document, so it is the
        # build that surfaces duplicate-label and cross-reference errors.
        # Assert the artifact exists and is non-empty so the job fails even if
        # the CLI ever returns success on a partial render.
        run: |
          myst build --pdf --ci --strict
          test -s _build/exports/copperline.pdf
      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copperline-docs-pdf
          path: docs/_build/exports/copperline.pdf
          if-no-files-found: ignore

  gdb-remote:
    name: GDB remote protocol tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: RSP unit tests
        # The RSP tests live in the library; selecting it avoids compiling
        # every integration-test executable just to filter out its tests.
        run: cargo test --locked --lib gdbstub
