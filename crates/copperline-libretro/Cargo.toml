[package]
name = "copperline-libretro"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Libretro frontend for the Copperline Amiga emulator"
publish = false

[workspace]

[lib]
name = "copperline_libretro"
crate-type = ["cdylib", "rlib"]

[dependencies]
copperline = { path = "../..", default-features = false }
anyhow = "1"
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep this explicit: Cargo's automatic debuginfo stripping can misalign
# Mach-O dylib LINKEDIT tables rejected by macOS 27's loader (rust#157750).
strip = "none"

[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
