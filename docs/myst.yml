# MyST project configuration for the Copperline documentation.
# Build HTML with `myst build --html` and PDF with `myst build --pdf`
# (the PDF export renders through Typst; see docs/README.md for the
# required tools).
version: 1
project:
  id: copperline-docs
  title: Copperline
  description: A cycle-driven Amiga emulator in Rust
  keywords: [amiga, emulator, ocs, ecs, rust]
  # --check-links + --strict fails the CI docs build when a linked site is
  # unreachable. archive.org has outages regularly enough that it broke an
  # unrelated PR; exempt it from link resolution (the link stays in the
  # rendered docs) so CI does not depend on its uptime. Keys match the
  # exact link URL, not the domain, so any new archive.org link needs its
  # own entry here. Everything else stays checked; add a key only for
  # sites with a history of downtime.
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        - http://archive.org
        # npcap.com answers interactive requests slowly (tens of seconds)
        # and timed out for three consecutive CI runs on 2026-08-18 while
        # resolving fine from other networks -- the same
        # availability-not-correctness failure mode as archive.org above.
        - https://npcap.com/
  authors:
    - name: Andrew Hutchings
  github: https://github.com/CopperlineHQ/Copperline
  toc:
    - file: index.md
    - title: User guide
      children:
        - file: guide/getting-started.md
        - file: guide/configuration.md
        - file: guide/ui.md
        - file: guide/whdload.md
        - file: guide/run.md
        - file: guide/fluxbridge.md
        - file: guide/host-disks.md
        - file: guide/mt32.md
        - file: guide/coppersynth.md
        - file: guide/modem.md
        - file: guide/import-uae.md
        - file: guide/winuae-state.md
        - file: guide/netplay.md
        - file: guide/headless.md
        - file: guide/browser.md
        - file: guide/libretro.md
        - file: guide/publishing.md
    - title: Extending
      children:
        - file: zorro.md
    - title: Reference
      children:
        - file: reference/custom-registers/index.md
        - pattern: reference/custom-registers/*.md
          hidden: true
    - title: Debugging
      children:
        - file: debugger/window.md
        - file: debugger/console.md
        - file: debugger/headless.md
        - file: debugger/reverse.md
        - file: debugger/waveform.md
        - file: debugger/profiling.md
        - file: debugger/vscode.md
        - file: debugger/vscode-bartman.md
        - file: debugger/gdb.md
        - file: debugger/dap.md
        - file: debugger/control.md
        - file: debugger/workflows.md
    - title: Internals
      children:
        - file: internals/architecture.md
        - file: internals/timing.md
        - file: internals/chipset.md
        - file: internals/video.md
        - file: internals/audio.md
        - file: internals/cpu.md
        - file: internals/peripherals.md
        - file: internals/toccata.md
        - file: internals/mhi.md
        - file: internals/copperhf.md
        - file: internals/zz9k.md
        - file: internals/picasso2.md
        - file: internals/graffity.md
        - file: internals/netplay.md
        - file: internals/savestate.md
        - file: internals/reference-docs.md
  exports:
    - format: pdf
      template: lapreprint-typst
      output: _build/exports/copperline.pdf
      articles:
        - index.md
        - guide/getting-started.md
        - guide/configuration.md
        - guide/ui.md
        - guide/whdload.md
        - guide/run.md
        - guide/fluxbridge.md
        - guide/host-disks.md
        - guide/mt32.md
        - guide/coppersynth.md
        - guide/modem.md
        - guide/import-uae.md
        - guide/winuae-state.md
        - guide/netplay.md
        - guide/headless.md
        - guide/browser.md
        - guide/libretro.md
        - guide/publishing.md
        - zorro.md
        - debugger/window.md
        - debugger/console.md
        - debugger/headless.md
        - debugger/reverse.md
        - debugger/waveform.md
        - debugger/profiling.md
        - debugger/vscode.md
        - debugger/vscode-bartman.md
        - debugger/gdb.md
        - debugger/dap.md
        - debugger/control.md
        - debugger/workflows.md
        - internals/architecture.md
        - internals/timing.md
        - internals/chipset.md
        - internals/video.md
        - internals/audio.md
        - internals/cpu.md
        - internals/peripherals.md
        - internals/toccata.md
        - internals/mhi.md
        - internals/copperhf.md
        - internals/zz9k.md
        - internals/picasso2.md
        - internals/graffity.md
        - internals/netplay.md
        - internals/savestate.md
        - internals/reference-docs.md
site:
  template: book-theme
  options:
    favicon: ../assets/brand/copperline.ico
    hide_authors: true
    logo: ../assets/brand/copperline-logo.png
    logo_alt: Copperline
    # The logo links back to the main site; the sidebar TOC covers the
    # docs themselves.
    logo_url: https://copperline.dev/
    # Restyles the HTML site build to match copperline.dev; see site.css.
    style: site.css
