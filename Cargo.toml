[package]
name = "copperline"
version = "0.19.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "A cycle-driven Amiga emulator written in Rust"
readme = "README.md"
repository = "https://github.com/CopperlineHQ/Copperline"
keywords = ["amiga", "emulator", "m68k"]
categories = ["emulators"]
publish = false
# `cargo run` should keep launching the emulator now that the headless
# `copperline-bench` bin target exists.
default-run = "copperline"

[features]
default = [
    "midi",
    "frontend",
    "wasm-boards",
    "control",
    "ctl-bin",
    "import-uae-bin",
    "net-nat",
    "net-bridge",
    "fluxbridge",
    "mt32",
    "coppersynth",
    "cpu-jit",
    "profile-stats",
    "game-library",
    "mhi",
    "cd-mp3",
    "cd32-fmv",
    "gdb",
    "dap",
    "netplay-internet",
]
# Native NAT traversal and encrypted relay fallback. The portable/WASM core
# keeps using its frontend-provided transport.
netplay-internet = ["dep:iroh", "dep:tokio", "dep:base64"]
# MT-32 emulation through CopperlineHQ/mt32-rs, reachable as a MIDI-Out
# target. Off builds carry none of it.
mt32 = ["dep:mt32-rs"]
# Coppersynth, the built-in General MIDI synthesizer (soundfont player
# with an MT-32 translation layer), reachable as the "coppersynth" MIDI-Out
# device. No ROMs needed; the soundfont is fetched or bundled separately.
coppersynth = ["dep:coppersynth"]
# The WHDLoad game library: the launcher's Library page, the local game
# database it reads, and the OpenRetro sync that fills it.
#
# This uses a blocking HTTP client and TLS stack. Off, the library client is
# not linked or compiled: WHDLoad boots from
# a path in the configuration exactly as it does with the feature on, the
# Library page is absent, and `[whdload]` keys that only the library uses
# are parsed and ignored so a configuration written by a full build still
# loads. See src/gamelib/.
game-library = ["dep:ureq", "dep:zeroize", "dep:base64"]
# The MHI virtual MPEG audio decoder board (src/mhi.rs, `[mhi]`): pulls in
# Symphonia's pure-Rust MPEG audio decoder. Kept a default-on feature (not an
# unconditional dependency) so builds that do not want the board -- the
# wasm32 browser build (crates/copperline-web, `default-features = false`)
# does not wire it up -- carry none of it, the same shape as `mt32`/
# `wasm-boards` above.
mhi = ["dep:symphonia-bundle-mp3", "dep:symphonia-core"]
# MP3 audio tracks in cue sheets (`FILE "track02.mp3" MP3`, src/cdrom/mp3.rs):
# the same Symphonia decoder as `mhi`, behind its own switch so a build can
# have either without the other; default-on for the same reason `mhi` is,
# and off in the browser build.
cd-mp3 = ["dep:symphonia-bundle-mp3", "dep:symphonia-core"]
# Commodore's CD32 Full Motion Video module: the L64111 MPEG Layer II path
# reuses Symphonia, while the CL450's MPEG-1 video path uses CopperlineHQ's
# safe pure-Rust plmpeg decoder. Native-only by construction: browser builds
# use `default-features = false` and do not fit this physical Zorro II module.
cd32-fmv = [
    "dep:plmpeg",
    "dep:symphonia-bundle-mp3",
    "dep:symphonia-core",
    "symphonia-bundle-mp3/mp2",
]
display-plan-trace = []
# Detailed host-cost counters used by native diagnostics. The browser crate
# builds the core with `default-features = false`, so its release hot paths do
# not pay for MMIO poll counters, sampled pipeline clocks, or per-render-phase
# `Instant` calls. The coarse browser core/render timers live in the web crate
# and remain available in every web build.
profile-stats = []
# Local investigation switches that deliberately alter timing or rendering.
# Normal builds keep these environment-variable overrides inert so release
# behavior is hardware-derived and reproducible.
internal-diagnostics = []
# Host MIDI bridge for Paula's serial port (`[serial] mode = "midi"`). Built in
# by default; `--no-default-features` compiles it out, and a MIDI-free build
# pulls no MIDI code and links no MIDI framework. Native backends per platform:
# CoreMIDI (macOS), the ALSA sequencer (Linux), WinMM (Windows); other targets
# get a stub. See src/midi/.
midi = []
# The interactive desktop frontend: the winit/pixels window and launcher,
# host audio output, gamepads, file dialogs, and the debugger console's
# clipboard paste. Off, the crate is the portable headless core (the surface
# a wasm32 browser frontend builds against); the `copperline` binary
# requires it.
frontend = [
    "dep:winit",
    "dep:pixels",
    "dep:cpal",
    "dep:gilrs",
    "dep:rfd",
    "dep:arboard",
    "dep:env_logger",
]
# The wasmtime host for functional Zorro boards (src/wasmboard.rs). Separate
# from `frontend` because it is a core-machine feature, but Cranelift cannot
# be compiled FOR wasm32, so browser builds turn it off.
wasm-boards = ["dep:wasmtime", "dep:socket2"]
# Native-code compilation of hot CPU traces (the m68k crate's Cranelift trace
# JIT), used by the `[cpu] jit` fast execution mode. Cranelift cannot be
# compiled FOR wasm32, so browser builds (--no-default-features) leave it off;
# `[cpu] jit` still works there through the crate's interpreted trace loop,
# just without native code generation.
cpu-jit = ["m68k/jit"]
# The headless `copperline-bench` benchmark binary (core-only; also builds
# for wasm32-wasip1). Off by default so native release artifacts are
# unchanged.
bench-bin = []
# The Copperline Control Protocol server (src/control/): a JSON-RPC interface
# over loopback TCP for driving the emulator from scripts and external tools
# (`--control` headless, `--control-gui` windowed). Uses std::net + threads,
# so browser builds (--no-default-features) compile it out.
control = ["dep:base64"]
# User-mode NAT backend for emulated NICs (`[a2065] net = "nat"`, src/net/nat/):
# a slirp-style virtual gateway giving the guest outbound IPv4 with no host
# privileges. Uses std::net + threads, so browser builds compile it out.
net-nat = ["dep:smoltcp"]
# Direct attachment of an emulated NIC to a host Ethernet adapter
# (`net = "bridge"`). Linux uses AF_PACKET (with the narrowly privileged
# copperline-net-helper when an unprivileged open is denied), macOS uses the
# system libpcap, and Windows loads an installed Npcap at runtime.
net-bridge = ["dep:pcap", "dep:libloading"]
# The `copperline-ctl` command-line client for the control protocol, and
# its `--mcp` mode (src/control/mcp.rs), an MCP server over stdio that
# exposes the protocol as tools for coding agents.
ctl-bin = ["control", "dap"]
# The `copperline-import-uae` converter for WinUAE/Amiberry/FS-UAE
# configuration files.
import-uae-bin = ["dep:toml_edit"]
# The remote GDB stub (`--gdb`, src/gdbstub.rs): a 68k-aware gdbserver over
# TCP. Default on; player builds (crates/copperline-player) leave it out so
# a shipped game carries no debugger surface.
gdb = ["control"]
# The Debug Adapter Protocol adapter (`copperline-ctl --dap`,
# src/control/dap/) and the guest debug-info reader behind it
# (src/debuginfo/: hunk symbol tables, vasm LINE debug hunks, DWARF from
# a bebbo debug hunk or an ELF sibling). A control-protocol client like
# the MCP mode, so it needs serde_json like `control`, plus gimli and
# object for DWARF and ELF. Off in player builds with the rest of the
# debugger surface.
dap = ["control", "dep:gimli", "dep:object"]
# Real floppy drives through FluxBridge (src/fluxbridge/): the Greaseweazle
# driver enabled on the dependency below stands in for a disk image on any bay.
# FluxBridge is a pure-Rust library, so there is nothing to install and no C++
# in the build. Off, none of it is built, which is what browser builds
# (--no-default-features) want.
fluxbridge = ["dep:fluxbridge"]

[dependencies]
m68k = { version = "0.12", features = ["serde"] }
# The MT-32 synthesiser engine: our own port of Munt, pinned by revision.
mt32-rs = { git = "https://github.com/CopperlineHQ/mt32-rs", rev = "ac00f818629a549a2712747660091e4f84d55599", optional = true }
# The General MIDI synthesiser (Coppersynth), pinned by revision.
coppersynth = { git = "https://github.com/CopperlineHQ/Coppersynth", rev = "38873e283aa9f2e6d2574d6c71e9a2cf9d0b42a2", optional = true }
pixels = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = { version = "0.23", optional = true }
sha2 = { version = "0.11", default-features = false }
# DWARF and ELF readers for the DAP adapter's debug-info module
# (src/debuginfo/): line tables, functions, variable locations, and CFI
# unwinding. Both pure Rust (MIT OR Apache-2.0).
gimli = { version = "0.34", default-features = false, features = ["read", "std"], optional = true }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"], optional = true }
# Formatting-preserving TOML writer, so the generated config can carry
# per-setting comments (copperline-import-uae only).
toml_edit = { version = "0.25", optional = true }
# The game library's HTTP client (src/gamelib/openretro.rs) is declared per
# platform, with the other per-target dependencies below: its TLS backend
# differs by what each host can build without a C toolchain.
# Wiping the OpenRetro password and auth token from memory once they are
# done with. Volatile writes with a compiler fence, which a hand-written
# overwrite of a buffer nothing reads again is entitled to be optimised
# away into nothing at all.
zeroize = { version = "1", optional = true }
serde-big-array = "0.5"
# MP3 (MPEG-1/2/2.5 Layer III) decoding for the MHI board (src/mhi.rs) and
# for MP3 audio tracks in cue sheets (src/cdrom/mp3.rs, feature `cd-mp3`).
# Symphonia's MPEG audio decoder: pure Rust (MPL-2.0, GPL-compatible), so it
# builds on every target Rust itself does -- in particular on
# aarch64-pc-windows-msvc, where the previous decoder's C build broke (its
# vendored minimp3.c promised NEON for MSVC ARM64 but only detected it via
# GCC/Clang macros; issue #474). Removing it also removed the last C compile
# from the default build. Only the Layer III feature is enabled, matching
# the board's CAPS register (Layer I/II are not part of protocol VERSION 1;
# see docs/internals/mhi.md). symphonia-core is the same project's type
# crate (Packet/CodecParameters/AudioBuffer), needed to drive the decoder
# directly -- src/mhi.rs feeds it hand-packetized frames from the board's
# byte-queue bitstream, and src/cdrom/mp3.rs frames from its own index of
# a track file, rather than going through a format reader.
symphonia-bundle-mp3 = { version = "0.6.1", default-features = false, features = ["mp3"], optional = true }
symphonia-core = { version = "0.6.1", default-features = false, optional = true }
# Safe incremental MPEG-1 video decoder used by the CD32 FMV module. The
# serde feature snapshots prediction frames and partial bitstream state rather
# than retaining and replaying the compressed stream on every save-state load.
plmpeg = { git = "https://github.com/CopperlineHQ/plmpeg-rs", rev = "d020ba1015b48c0c646d32b16a27157623fff915", features = ["serde"], optional = true }
# In-process snapshots (reverse debugging, run-ahead, netplay rollback):
# positional bincode, written and read by the same build only, so its wire
# format is never a compatibility concern. Held on the 1.x serde API on
# purpose: bincode 2 replaces the API and its defaults use a different wire
# format, while bincode 3 is an intentionally non-functional tombstone
# release. .clstate files do not use it (see rmp-serde below).
bincode = "1"
# Save-state files (src/savestate/chunk.rs): self-describing MessagePack
# chunk payloads, so a struct can gain or lose fields between releases
# without invalidating old states; rmpv carries the value tree that chunk
# migrations rewrite.
rmp = "0.8"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
toml = "1.1"
png = "0.18"
flate2 = "1"
cpal = { version = "0.18", optional = true }
# Kept unconditional (not `frontend`-gated) because the Windows MIDI backend
# (src/midi/winmm.rs) also uses it; it is pure Rust and wasm-safe.
ringbuf = "0.5"
hound = "3.5"
rfd = { version = "0.17.2", optional = true }
gilrs = { version = "0.11", optional = true }
# Host clipboard for the debugger console's paste (text only; the default
# image-data feature is left off). wayland-data-control covers Wayland
# hosts; X11 support is built in on Linux.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }
# WASM plugin host for functional Zorro boards (src/wasmboard.rs). Lean feature
# set: the Cranelift JIT + runtime only -- no WASI, component model, GC, threads,
# or wat parsing in the shipped binary (kept deterministic; see the determinism
# Config in wasmboard.rs). Pin the version: save-state replay of a plugin's
# linear-memory snapshot is only guaranteed within one wasmtime build, so
# changing this means bumping the ZORR chunk version in src/savestate/chunk.rs
# (with a migration or a documented refusal), not a routine update.
# Track an LTS line (24.x, 36.x, 48.x, ...): those keep receiving security
# backports, which the line this was previously pinned to (27.x) did not.
wasmtime = { version = "=36.0.14", default-features = false, features = ["cranelift", "runtime"], optional = true }
# Non-blocking connect + cross-platform socket options for the `host_sockets`
# wasm-plugin capability (src/wasmboard.rs): the host-socket backend for the
# bundled HostSocket board (`[hostsocket] net = "host"`). Pure Rust wrapper
# over the platform socket API, no C library linked.
socket2 = { version = "0.6", optional = true }
# Userspace TCP/IP stack for the NAT backend (src/net/nat/): terminates the
# guest's ARP and TCP on the virtual gateway so flows can be spliced onto host
# sockets. Pure Rust, 0BSD, lean feature set: Ethernet + IPv4 + TCP sockets
# only (DHCP/DNS/UDP/ICMP are handled at frame level with the wire parsers).
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
], optional = true }
# Already pulled in transitively; used directly only for localtime_r (local
# time-zone filename stamps) and, on macOS, the pthread QoS class used for the
# optional realtime-priority feature (see src/priority.rs).
libc = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }
# Physical floppy drives: CopperlineHQ/FluxBridge, tracking its main branch.
# Pure Rust -- the interfaces sit behind one typed API with no C or C++ ABI,
# so nothing has to be installed and nothing is vendored. `Cargo.lock` still
# fixes the exact commit every build uses, so a checkout is reproducible;
# `cargo update -p fluxbridge` is how a newer one is taken. Only the drivers
# named here are compiled in, and the launcher's interface list follows this
# line: adding a driver Copperline supports means adding its feature, nothing
# else.
fluxbridge = { git = "https://github.com/CopperlineHQ/FluxBridge", branch = "main", default-features = false, features = ["greaseweazle"], optional = true }
# CHD (MAME "Compressed Hunks of Data") CD images (src/cdrom/chd.rs). Pure
# Rust, so it builds for wasm32 browser targets like the rest of the core.
chd = "0.3"
delharc = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# macOS dock icon: winit's with_window_icon is a no-op on macOS, so the dock
# icon must be set at runtime via NSApplication. These objc2 versions match the
# ones rfd already pulls in, so they add no new crate copies to the build.
# The game library's HTTP client. Blocking, which is what a worker thread
# wants. The TLS backend differs by platform for build requirements rather
# than for taste; the trust anchors do not, since both are pointed at the
# Mozilla root set `webpki-roots` bundles rather than at the host's store.
#
# Everywhere but Windows: rustls, so a build needs no system OpenSSL and the
# Flatpak carries no extra runtime.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
], optional = true }

# Windows: schannel, the OS's own TLS, reached through pure-Rust bindings.
# rustls would do on x86-64, but its crypto provider (`ring`) compiles C and
# assembly, and on ARM64 Windows `ring` ignores MSVC and demands clang -- see
# the FIXME in its build.rs -- so a default build fails on a machine carrying
# exactly the toolchain Rust itself asks for. This HTTP client needs no C
# compiler; the separate netplay-internet feature uses ring and needs clang
# on Windows ARM64 (packaging/windows/enable-clang.ps1).
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = [
    "native-tls",
    "gzip",
], optional = true }

# The opt-in uaelib file bridge opens guest paths through a held directory
# capability, so path lookup remains beneath the --run directory even when a
# hostile process swaps symlinks concurrently. Browser builds have no host
# filesystem authority and do not compile this dependency.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = { version = "1.1", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
cap-std = "4.0"
tempfile = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
pcap = { version = "2.4", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Npcap is deliberately not linked at build time: the bridge backend loads it
# from a trusted system directory only when selected, so NAT-only installs do
# not acquire a runtime DLL dependency.
libloading = { version = "0.9", optional = true }
# HostSocket's direct host-socket backend uses WSAPoll for real listener and
# connect/read/write readiness. This is the Windows counterpart of poll(2);
# in particular it can report a queued connection on a listening socket,
# which MSG_PEEK cannot.
# Win32_System_IO is DeviceIoControl, which src/diskimage.rs uses to ask
# NTFS for a sparse file: setting a file's length commits the space there,
# where on Unix it leaves a hole.
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

# Optional realtime-priority feature: cross-platform thread scheduling control.
# Only used off macOS -- the macOS path uses the libc pthread QoS API directly
# (Core Audio already runs the audio callback real-time), so this crate (and
# the windows-sys it pulls in) never enters the macOS build. Excluded on
# wasm32, where there are no host threads to schedule.
[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
thread-priority = "3.1"

# Browser builds only: std::time::Instant/SystemTime panic on
# wasm32-unknown-unknown; web-time backs them with performance.now()/Date.now().
# See src/timebase.rs -- native targets re-export std::time unchanged.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[[bin]]
name = "copperline"
path = "src/main.rs"
required-features = ["frontend"]

[[bin]]
name = "copperline-bench"
path = "src/bin/bench.rs"
required-features = ["bench-bin"]

[[bin]]
name = "copperline-ctl"
path = "src/bin/copperline-ctl.rs"
required-features = ["ctl-bin"]

[[bin]]
name = "copperline-import-uae"
path = "src/bin/copperline-import-uae.rs"
required-features = ["import-uae-bin"]

[[bin]]
name = "copperline-net-helper"
path = "src/bin/copperline-net-helper.rs"
required-features = ["net-bridge"]

[dev-dependencies]
syn = { version = "3", features = ["full", "visit"] }
# Compile WAT to wasm bytes in the WASM-plugin-host tests, so golden test
# plugins live as readable text in the tests rather than checked-in binaries.
wat = "1"

[lints.clippy]
# Chipset pipeline functions take per-signal argument lists that mirror the
# hardware; bundling them into structs would obscure the data flow.
too_many_arguments = "allow"
# Indexed loops over fixed-size register banks (bitplanes, sprites, audio
# channels) keep the channel number visible and often index several parallel
# arrays; iterator rewrites obscure that.
needless_range_loop = "allow"
# Promoted to warn-by-default in clippy 1.98, instantly flagging ~46
# established chunks_exact(N) sites across the chipset, floppy, DMS, and
# video code. The as_chunks form changes element types (&[T] -> &[T; N]),
# so migrating is a deliberate sweep of hot hardware paths, not a lint
# chore to smuggle into an unrelated change. Allowed until that sweep.
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
# Copperline's hottest paths cross the CPU/bus/chipset/render module
# boundaries. Whole-program optimization is measurably worthwhile here:
# the AROS benchmark is about 10% faster core-only and 7% faster with
# rendering than thin LTO, and the resulting executable is smaller.
lto = "fat"
codegen-units = 1

# CI needs optimized emulation, but linking every test executable with fat
# LTO dominates build time. Keep release semantics (including disabled debug
# assertions/overflow checks) while allowing parallel code generation. The
# packaged release binaries continue to use the profile above.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
